<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AİDEN | {{ project.title }}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <!-- 3D Oynatıcı Kütüphanesi -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>
</head>
<body class="portfolio-page">

    <div class="frame-border frame-top"></div>
    <div class="frame-border frame-bottom"></div>
    <div class="frame-border frame-left"></div>
    <div class="frame-border frame-right"></div>

    <!-- ÜST MENÜ -->
    <nav class="artist-navbar">
        <div class="nav-side left-links">
            <a href="/portfolio"><i class="fa-solid fa-arrow-left"></i> Geri Dön</a>
        </div>
        <div class="nav-center-logo">
            <h1>AİDEN</h1>
        </div>
        <div class="nav-side right-links">
            <a href="/">Home</a>
        </div>
    </nav>

    <!-- GALERİ ESER ALANI -->
    <main class="gallery-container">
        
        <!-- ÜST KISIM: ESER GÖSTERİMİ -->
        <div class="gallery-showcase">
            {% if project.youtube_url %}
                <!-- 1. EĞER YOUTUBE LİNKİ VARSA VİDEOYU GÖSTER -->
                <iframe src="{{ project.youtube_url }}" 
                        style="width: 100%; height: 100%; border: none; outline: none; background: #000;" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                </iframe>
            {% elif project.model_file %}
                <!-- 2. EĞER 3D MODEL VARSA 3D GÖSTER -->
                <model-viewer 
                    src="{{ url_for('static', filename='uploads/' + project.model_file) }}" 
                    alt="{{ project.title }}" 
                    camera-controls auto-rotate bounds="tight"
                    environment-image="neutral" shadow-intensity="1.5" exposure="1.2"
                    style="width: 100%; height: 100%; outline: none;">
                </model-viewer>
            {% else %}
                <!-- 3. İKİSİ DE YOKSA KAPAK RESMİNİ GÖSTER -->
                <img src="{{ url_for('static', filename='uploads/' + project.image) }}" alt="{{ project.title }}">
            {% endif %}
        </div>

        <!-- ALT KISIM: ESER BİLGİLERİ -->
        <div class="gallery-info">
            <span class="gallery-category">{{ project.category }}</span>
            <h1 class="gallery-title">{{ project.title }}</h1>
            <div class="gallery-line"></div>
            <p class="gallery-desc">{{ project.description }}</p>
            
            <div class="gallery-tags">
                {% for tag in project.get_tags_list() %}
                    <span class="tag-badge">#{{ tag }}</span>
                {% endfor %}
            </div>
        </div>

    </main>
</body>
</html>
